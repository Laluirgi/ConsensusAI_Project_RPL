<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consensus AI — Admin Panel</title>
    <meta name="description" content="Admin panel untuk mengelola feedback dan rating Consensus AI." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-hover: #1a1a1a;
            --border: #1e1e1e;
            --border-hover: #333;
            --text: #f0f0f0;
            --text-secondary: #888;
            --text-muted: #555;
            --accent: #c8f261;
            --accent-dim: rgba(200, 242, 97, 0.08);
            --danger: #f87171;
            --warning: #fbbf24;
            --success: #6ee7b7;
            --info: #60a5fa;
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Inter', system-ui, sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --transition: 0.2s ease;
        }

        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.6; }

        .app { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }

        /* ── Sidebar ── */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-top { padding: 18px; border-bottom: 1px solid var(--border); }
        .logo { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
        .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
        .logo-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; letter-spacing: 0; text-transform: none; }

        .nav { flex: 1; padding: 8px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); color: var(--text-secondary); font-size: 13px; }
        .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }
        .nav-badge { margin-left: auto; background: rgba(255,255,255,0.08); padding: 1px 8px; border-radius: 10px; font-size: 11px; font-family: var(--mono); color: var(--text-muted); }
        .nav-item.active .nav-badge { background: var(--accent-dim); color: var(--accent); }

        .sidebar-bottom { padding: 12px; border-top: 1px solid var(--border); }
        .back-btn { width: 100%; padding: 9px 14px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; font-family: var(--font); cursor: pointer; text-align: left; transition: all var(--transition); }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Main ── */
        .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .topbar { padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .topbar-title { font-size: 16px; font-weight: 600; }
        .topbar-sub { font-size: 12px; color: var(--text-muted); }

        .content { flex: 1; overflow-y: auto; padding: 24px 28px; }

        /* ── Dashboard cards ── */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: all var(--transition); }
        .stat-card:hover { border-color: var(--border-hover); }
        .stat-icon { font-size: 22px; margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; font-family: var(--mono); color: var(--text); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        /* ── Feedback list ── */
        .section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .feedback-list { display: flex; flex-direction: column; gap: 10px; }
        .feedback-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: all var(--transition); }
        .feedback-card:hover { border-color: var(--border-hover); }
        .feedback-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .feedback-id { font-size: 11px; font-family: var(--mono); color: var(--text-muted); }
        .feedback-date { font-size: 11px; color: var(--text-muted); }
        .feedback-cat-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .feedback-cat-badge.bug { background: rgba(248,113,113,0.15); color: var(--danger); }
        .feedback-cat-badge.saran { background: rgba(251,191,36,0.15); color: var(--warning); }
        .feedback-cat-badge.lainnya { background: rgba(96,165,250,0.15); color: var(--info); }
        .feedback-message { font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 10px; }
        .feedback-card-bottom { display: flex; align-items: center; gap: 10px; }
        .status-select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; font-family: var(--font); padding: 4px 8px; cursor: pointer; outline: none; }
        .status-indicator { width: 8px; height: 8px; border-radius: 50%; }
        .status-indicator.pending { background: var(--warning); }
        .status-indicator.in_progress { background: var(--info); }
        .status-indicator.done { background: var(--success); }
        .delete-btn { margin-left: auto; background: transparent; border: 1px solid rgba(248,113,113,0.3); border-radius: 6px; color: var(--danger); font-size: 11px; font-family: var(--font); padding: 4px 10px; cursor: pointer; transition: all var(--transition); }
        .delete-btn:hover { background: rgba(248,113,113,0.1); }

        /* ── Ratings ── */
        .rating-avg { font-size: 36px; font-weight: 700; color: var(--warning); font-family: var(--mono); }
        .rating-avg-sub { font-size: 12px; color: var(--text-muted); }
        .rating-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
        .rating-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
        .rating-stars { font-size: 14px; }
        .rating-chatid { font-size: 11px; font-family: var(--mono); color: var(--text-muted); flex: 1; }
        .rating-date { font-size: 11px; color: var(--text-muted); }

        /* Empty state */
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .empty-state-icon { font-size: 36px; opacity: 0.3; margin-bottom: 12px; }
        .empty-state p { font-size: 13px; }

        /* Loading */
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

        /* Responsive */
        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <div class="logo-dot"></div>
                    Consensus AI
                </div>
                <div class="logo-sub">Admin Panel</div>
            </div>

            <div class="nav" id="navMenu">
                <div class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
                    <span class="nav-icon">📊</span> Dashboard
                </div>
                <div class="nav-item" data-page="bug" onclick="switchPage('bug')">
                    <span class="nav-icon">🐛</span> Bug
                    <span class="nav-badge" id="badgeBug">0</span>
                </div>
                <div class="nav-item" data-page="saran" onclick="switchPage('saran')">
                    <span class="nav-icon">💡</span> Saran
                    <span class="nav-badge" id="badgeSaran">0</span>
                </div>
                <div class="nav-item" data-page="lainnya" onclick="switchPage('lainnya')">
                    <span class="nav-icon">💬</span> Lainnya
                    <span class="nav-badge" id="badgeLainnya">0</span>
                </div>
                <div class="nav-item" data-page="ratings" onclick="switchPage('ratings')">
                    <span class="nav-icon">⭐</span> Rating
                </div>
            </div>

            <div class="sidebar-bottom">
                <button class="back-btn" onclick="window.location.href='index.html'">← Kembali ke App</button>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">
            <div class="topbar">
                <div>
                    <div class="topbar-title" id="pageTitle">Dashboard</div>
                    <div class="topbar-sub" id="pageSub">Ringkasan feedback & rating</div>
                </div>
            </div>

            <div class="content" id="content">
                <div class="loading">Memuat data...</div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentPage = 'dashboard';
        let allFeedbacks = [];
        let allRatings = [];
        let stats = {};

        // ── Init ──
        async function init() {
            await loadData();
            renderPage();
        }

        async function loadData() {
            try {
                const [fbRes, rtRes, stRes] = await Promise.all([
                    fetch(`${API_BASE}/admin/feedbacks`),
                    fetch(`${API_BASE}/admin/ratings`),
                    fetch(`${API_BASE}/admin/stats`)
                ]);
                const fbData = await fbRes.json();
                const rtData = await rtRes.json();
                const stData = await stRes.json();
                allFeedbacks = fbData.feedbacks || [];
                allRatings = rtData.ratings || [];
                stats = stData;

                // Update badges
                const bugCount = allFeedbacks.filter(f => f.category === 'bug').length;
                const saranCount = allFeedbacks.filter(f => f.category === 'saran').length;
                const lainnyaCount = allFeedbacks.filter(f => f.category === 'lainnya').length;
                document.getElementById('badgeBug').textContent = bugCount;
                document.getElementById('badgeSaran').textContent = saranCount;
                document.getElementById('badgeLainnya').textContent = lainnyaCount;
            } catch (e) {
                document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Gagal memuat data. Pastikan backend berjalan di ${API_BASE}</p></div>`;
            }
        }

        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
            renderPage();
        }

        function renderPage() {
            const content = document.getElementById('content');
            const title = document.getElementById('pageTitle');
            const sub = document.getElementById('pageSub');

            switch (currentPage) {
                case 'dashboard':
                    title.textContent = 'Dashboard';
                    sub.textContent = 'Ringkasan feedback & rating';
                    renderDashboard(content);
                    break;
                case 'bug':
                case 'saran':
                case 'lainnya':
                    const labels = { bug: '🐛 Bug Reports', saran: '💡 Saran', lainnya: '💬 Lainnya' };
                    title.textContent = labels[currentPage];
                    sub.textContent = `Semua feedback kategori ${currentPage}`;
                    renderFeedbackList(content, currentPage);
                    break;
                case 'ratings':
                    title.textContent = '⭐ Rating';
                    sub.textContent = 'Semua rating dari user';
                    renderRatings(content);
                    break;
            }
        }

        // ── Dashboard ──
        function renderDashboard(container) {
            const ratingStats = stats.ratings || { total: 0, average: 0 };
            const fbStats = stats.feedbacks || {};
            const totalFb = fbStats.total || 0;
            const bugCount = fbStats.bug?.count || 0;
            const saranCount = fbStats.saran?.count || 0;
            const lainCount = fbStats.lainnya?.count || 0;
            const pendingCount = (fbStats.bug?.pending || 0) + (fbStats.saran?.pending || 0) + (fbStats.lainnya?.pending || 0);

            container.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📬</div>
                        <div class="stat-value">${totalFb}</div>
                        <div class="stat-label">Total Feedback</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🐛</div>
                        <div class="stat-value">${bugCount}</div>
                        <div class="stat-label">Bug Reports</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💡</div>
                        <div class="stat-value">${saranCount}</div>
                        <div class="stat-label">Saran</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏳</div>
                        <div class="stat-value">${pendingCount}</div>
                        <div class="stat-label">Belum Ditangani</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⭐</div>
                        <div class="stat-value">${ratingStats.average}</div>
                        <div class="stat-label">Rata-rata Rating (${ratingStats.total} votes)</div>
                    </div>
                </div>

                <div class="section-title">📬 Feedback Terbaru</div>
                <div class="feedback-list" id="dashFeedbackList"></div>`;

            const list = document.getElementById('dashFeedbackList');
            if (allFeedbacks.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><p>Belum ada feedback.</p></div>';
            } else {
                allFeedbacks.slice(0, 5).forEach(fb => list.appendChild(createFeedbackCard(fb)));
            }
        }

        // ── Feedback List ──
        function renderFeedbackList(container, category) {
            const filtered = allFeedbacks.filter(f => f.category === category);
            container.innerHTML = `<div class="feedback-list" id="fbList"></div>`;
            const list = document.getElementById('fbList');

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><p>Belum ada ${category}.</p></div>`;
            } else {
                filtered.forEach(fb => list.appendChild(createFeedbackCard(fb)));
            }
        }

        function createFeedbackCard(fb) {
            const div = document.createElement('div');
            div.className = 'feedback-card';
            const date = new Date(fb.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `
                <div class="feedback-card-top">
                    <span class="feedback-id">#${String(fb.id).padStart(3, '0')}</span>
                    <span class="feedback-date">${date}</span>
                    <span class="feedback-cat-badge ${fb.category}">${{ bug: '🐛 Bug', saran: '💡 Saran', lainnya: '💬 Lainnya' }[fb.category]}</span>
                </div>
                <div class="feedback-message">${escHtml(fb.message)}</div>
                <div class="feedback-card-bottom">
                    <span class="status-indicator ${fb.status}"></span>
                    <select class="status-select" onchange="updateStatus(${fb.id}, this.value)">
                        <option value="pending" ${fb.status === 'pending' ? 'selected' : ''}>🟡 Pending</option>
                        <option value="in_progress" ${fb.status === 'in_progress' ? 'selected' : ''}>🔵 In Progress</option>
                        <option value="done" ${fb.status === 'done' ? 'selected' : ''}>🟢 Done</option>
                    </select>
                    <button class="delete-btn" onclick="deleteFeedback(${fb.id})">🗑 Hapus</button>
                </div>`;
            return div;
        }

        // ── Ratings ──
        function renderRatings(container) {
            const ratingStats = stats.ratings || { total: 0, average: 0 };
            container.innerHTML = `
                <div class="stat-grid" style="margin-bottom:20px;">
                    <div class="stat-card">
                        <div class="stat-icon">⭐</div>
                        <div class="rating-avg">${ratingStats.average}</div>
                        <div class="rating-avg-sub">dari ${ratingStats.total} rating</div>
                    </div>
                </div>
                <div class="section-title">⭐ Semua Rating</div>
                <div class="rating-list" id="ratingList"></div>`;

            const list = document.getElementById('ratingList');
            if (allRatings.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⭐</div><p>Belum ada rating.</p></div>';
            } else {
                allRatings.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'rating-item';
                    const date = new Date(r.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                    const stars = '⭐'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    div.innerHTML = `
                        <span class="rating-stars">${stars}</span>
                        <span class="rating-chatid">Chat: ${r.chat_id}</span>
                        <span class="rating-date">${date}</span>`;
                    list.appendChild(div);
                });
            }
        }

        // ── Actions ──
        async function updateStatus(id, status) {
            try {
                await fetch(`${API_BASE}/admin/feedbacks/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                await loadData();
                renderPage();
            } catch (e) { alert('Gagal update: ' + e.message); }
        }

        async function deleteFeedback(id) {
            if (!confirm('Yakin ingin menghapus feedback ini?')) return;
            try {
                await fetch(`${API_BASE}/admin/feedbacks/${id}`, { method: 'DELETE' });
                await loadData();
                renderPage();
            } catch (e) { alert('Gagal hapus: ' + e.message); }
        }

        function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        // ── Init ──
        init();
    </script>
</body>

</html>
